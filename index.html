<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Special For You 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: black;
    overflow: hidden;
    color: white;
}

/* BINTANG */
.star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    animation: twinkle 2s infinite;
}
@keyframes twinkle {
    0%,100% {opacity: 0.2;}
    50% {opacity: 1;}
}

/* LOGIN */
#login {
    position: absolute;
    width: 100%;
    top: 30%;
    text-align: center;
}

input {
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 10px 20px;
    border-radius: 20px;
    border: none;
    background: pink;
    cursor: pointer;
}

/* MAIN */
#main {
    display: none;
    text-align: center;
    margin-top: 50px;
}

/* CHAT STYLE */
.chat {
    width: 300px;
    margin: auto;
    text-align: left;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 15px;
}

.msg {
    background: pink;
    color: black;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    animation: fade 1s;
}

@keyframes fade {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1;}
}

/* FOTO */
img {
    width: 150px;
    border-radius: 20px;
    margin: 20px;
}

/* EMOJI */
.fall {
    position: fixed;
    top: -10px;
    animation: fall linear infinite;
}
@keyframes fall {
    to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h2>💌 Masuk dulu ya</h2>
    <input id="user" placeholder="Nama"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Masuk 💖</button>
</div>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="lagu.mp3">
</audio>

<!-- MAIN -->
<div id="main">
    <h1 id="judul"></h1>

    <img src="foto2.jpg">

    <div class="chat" id="chat"></div>

    <button onclick="mulai()">Mulai Pesan 💬</button>
    <br><br>
    <button onclick="toggleMusic()">🎵 Play/Pause</button>
</div>

<script>

/* LOGIN */
function login(){
    let u = document.getElementById("user").value;
    let p = document.getElementById("pass").value;

    if(u === "risda" && p === "123"){
        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
        document.getElementById("music").play();
        judulAnimasi();
        efek();
    } else {
        alert("Salah");
    }
}

/* JUDUL ANIMASI */
function judulAnimasi(){
    let text = "🎂 Happy Birthday Risda🎂";
    let i = 0;
    let el = document.getElementById("judul");

    function ketik(){
        if(i < text.length){
            el.innerHTML += text[i];
            i++;
            setTimeout(ketik,100);
        }
    }
    ketik();
}

/* CHAT */
let pesan = [
"Selamat ulang tahun 🎉",
"Semoga kamu semakin kuat menjalani kuliahmu",
"Ingat selalu orang tua yang mendoakanmu",
"Jangan menyerah, kamu pasti bisa",
"Kamu tidak sendiri 💖",
'"When you want something, all the universe conspires in helping you to achieve it."'
];

let i = 0;

function mulai(){
    if(i < pesan.length){
        let div = document.createElement("div");
        div.className = "msg";
        div.innerText = pesan[i];
        document.getElementById("chat").appendChild(div);
        i++;
        setTimeout(mulai,1500);
    }
}

/* MUSIK */
function toggleMusic(){
    let m = document.getElementById("music");
    m.paused ? m.play() : m.pause();
}

/* BINTANG */
for(let i=0;i<100;i++){
    let s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    document.body.appendChild(s);
}

/* EFEK */
function efek(){
    setInterval(()=>{
        let e = document.createElement("div");
        e.className = "fall";
        let emoji = ["🎉","🎊","✨","🎂"];
        e.innerHTML = emoji[Math.floor(Math.random()*emoji.length)];
        e.style.left = Math.random()*100+"vw";
        e.style.animationDuration = (Math.random()*3+2)+"s";
        document.body.appendChild(e);
        setTimeout(()=>e.remove(),4000);
    },200);
}

</script>

</body>
</html>
